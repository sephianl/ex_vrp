name: AB Benchmark

on:
  pull_request:
    types: [labeled, synchronize]

# Three jobs, all on GitHub-hosted runners: `quality` solves the corpus on both refs,
# `speed` counts the solver's instructions per iteration on both refs under Callgrind
# (hosted runners expose no hardware counters, and our self-hosted fleet serves only
# private repositories), and `report` compares both and posts one verdict.
#
# Only PRs from this repository run it: a fork PR's read-only token could not post the
# comment.

jobs:
  quality:
    if: contains(github.event.pull_request.labels.*.name, 'benchmark') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 150
    # Every run step executes inside the devenv shell. devenv 2 runs all git hooks
    # (a full `mix check`, ~2.5 min) on each shell entry and ignores DEVENV_NO_GIT_HOOKS;
    # their failures don't fail the step, so they only cost time and print noise.
    defaults:
      run:
        shell: devenv -O git-hooks.enable:bool false shell bash -e {0}
    env:
      # Force a from-source NIF build for BOTH refs. Without this, cc_precompiler serves the
      # released binary keyed on the package VERSION (not the git ref), so HEAD and BASE would
      # get the identical prebuilt solver and every A/B comparison would falsely show "no change".
      EX_VRP_FORCE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Install devenv
        shell: bash
        run: |
          nix profile install --accept-flake-config github:cachix/devenv/latest

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      # HEAD run: solver code (lib/ + c_src/) is at the PR head commit.
      # The benchmark harness (dev/, priv/benchmark_data/, mix tasks) is also at head.
      # --budget-cap keeps total runtime bounded; tune this value to fit the runner's time budget.
      # Four seeds because ubuntu-latest has four cores: seeds solve concurrently, so this is the
      # most samples obtainable at no extra wall-clock, and a fifth would queue behind the others
      # and then solve on an idle machine, which biases its result. See Runner's moduledoc.
      - name: Build + run HEAD
        run: |
          mix deps.get
          mix compile
          mix bench.run --out /tmp/results-head.json --ref head --seeds 1,2,3,4 --budget-cap 60

      # NOTE: We only revert the solver sources (lib/ and c_src/) to the PR base.
      # The benchmark harness (dev/, priv/benchmark_data/, mix tasks) intentionally stays at
      # HEAD for both runs so that both refs are evaluated under identical harness conditions.
      #
      # CRITICAL: we must wipe the compiled NIF artifacts (priv/*.so and c_src/obj) before
      # rebuilding. A stale HEAD-built .so would make the BASE run silently use HEAD's solver,
      # so the A/B comparison would show no difference and report a false "safe". The whole
      # validity of the comparison depends on a clean C++ rebuild here.
      - name: Revert solver to BASE, keep harness from HEAD
        run: |
          rm -rf lib c_src
          git checkout ${{ github.event.pull_request.base.sha }} -- lib c_src Makefile
          rm -f priv/ex_vrp_nif.so

      # BASE run: solver code is now at the base commit; harness remains at HEAD (see above).
      # mix compile --force triggers a full NIF rebuild from scratch (artifacts wiped above).
      # --budget-cap is tunable to fit the runner time budget.
      - name: Build + run BASE
        run: |
          mix deps.get
          mix compile --force
          mix bench.run --out /tmp/results-base.json --ref base --seeds 1,2,3,4 --budget-cap 60

      - name: Upload quality results
        uses: actions/upload-artifact@v4
        with:
          name: quality-results
          path: /tmp/results-*.json

  speed:
    if: contains(github.event.pull_request.labels.*.name, 'benchmark') && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 150
    defaults:
      run:
        shell: devenv -O git-hooks.enable:bool false shell bash -e {0}
    env:
      EX_VRP_FORCE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Install devenv
        shell: bash
        run: |
          nix profile install --accept-flake-config github:cachix/devenv/latest

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      # Built from source on a cold Nix cache (about ten minutes), so it gets its own step
      # rather than hiding inside the first count.
      - name: Build the interpreter-only Erlang
        run: nix build --no-link -f dev/ab_benchmark/interpreter_erlang.nix

      - name: Fetch and compile dependencies
        run: |
          mix deps.get
          mix deps.compile

      # The BASE tree is a copy of HEAD with only the solver sources (lib/, c_src/, Makefile)
      # reverted, so both refs measure under HEAD's harness, as in `quality`. Its ex_vrp build
      # is wiped so it cannot reuse a HEAD-built NIF.
      - name: Prepare the BASE tree
        run: |
          cp -a "$GITHUB_WORKSPACE" "$RUNNER_TEMP/base"
          cd "$RUNNER_TEMP/base"
          rm -rf lib c_src _build/dev/lib/ex_vrp priv/ex_vrp_nif.so
          git checkout ${{ github.event.pull_request.base.sha }} -- lib c_src Makefile

      - name: Count HEAD instructions
        run: |
          mix compile
          mix bench.speed --out "$RUNNER_TEMP/speed-head.json" --ref head

      - name: Count BASE instructions
        working-directory: ${{ runner.temp }}/base
        run: |
          mix compile
          mix bench.speed --out "$RUNNER_TEMP/speed-base.json" --ref base

      - name: Upload speed results
        uses: actions/upload-artifact@v4
        with:
          name: speed-results
          path: ${{ runner.temp }}/speed-*.json

  report:
    needs: [quality, speed]
    if: always() && needs.quality.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
    defaults:
      run:
        shell: devenv -O git-hooks.enable:bool false shell bash -e {0}
    env:
      EX_VRP_FORCE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Install devenv
        shell: bash
        run: |
          nix profile install --accept-flake-config github:cachix/devenv/latest

      - name: Download results
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/results
          merge-multiple: true

      # A job that failed leaves its results missing; bench.compare then fails on the
      # missing file, and the comment says the benchmark produced no report.
      # set -o pipefail returns bench.compare's exit code (1 on regression), not tee's.
      - name: Compare
        run: |
          set -o pipefail
          mix local.hex --force --if-missing
          mix local.rebar --force --if-missing
          mix deps.get
          mix bench.compare "$RUNNER_TEMP/results/results-base.json" "$RUNNER_TEMP/results/results-head.json" \
            --speed-base "$RUNNER_TEMP/results/speed-base.json" --speed-head "$RUNNER_TEMP/results/speed-head.json" \
            --markdown "$RUNNER_TEMP/report.md"

      - name: Post report comment
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '### A/B Benchmark\n\nNo report produced: see the workflow run.';
            try { body = fs.readFileSync(`${process.env.RUNNER_TEMP}/report.md`, 'utf8'); } catch (e) {}
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
