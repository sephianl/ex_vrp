name: SwapStar Experiment

# Three-arm experiment measuring whether SwapStar is worth enabling, and
# whether repairing its geographic pruning would buy anything.
#
#   A  EX_VRP_SWAP_STAR unset  baseline; the operator is absent (shipped behaviour)
#   B  EX_VRP_SWAP_STAR=0.05   SwapStar with upstream's default overlap tolerance
#   C  EX_VRP_SWAP_STAR=1.0    SwapStar evaluating every route pair (no pruning)
#
# Why arm C is the point: `search::Route::overlapsWith` prunes candidate route
# pairs by the polar angle of their centroids. Zelo feeds synthetic coordinates
# (x = matrix index, y = 0), so every point is collinear and that pruning
# degenerates into an arbitrary bisection by mean index. Arm C evaluates a
# strict superset of the pairs any correct geometry would select, so C bounds
# from above whatever fixing the coordinates could buy. If C ~= B, the
# coordinate work is not worth doing and no Zelo change is needed.
#
# All three arms run from ONE build, differing only by the environment
# variable. That is deliberate: rebuilding per arm would reintroduce
# build-to-build variance into the very numbers we are trying to compare.

# Triggering: add the `benchmark` label to a PR from this branch. A
# workflow_dispatch entry is kept for re-runs with different knobs, but it only
# appears in the Actions UI once this file is on the default branch, whereas the
# label works from a branch immediately because pull_request events read the
# workflow from the PR merge ref.
#
# The `benchmark` label also starts the AB Benchmark job. That one compares this
# branch against main with EX_VRP_SWAP_STAR unset in both arms, so it is a
# same-code comparison and its deltas are a second sample of the harness noise
# floor rather than a measurement of SwapStar.

on:
  workflow_dispatch:
    inputs:
      budget_cap:
        description: >-
          Per-instance wall-clock cap in seconds. Production solves run
          114-215s, so caps below ~120 truncate the large prize-collecting
          instances before they converge and measure per-iteration cost
          rather than final quality.
        required: false
        default: "120"
      seeds:
        description: >-
          Comma-separated seeds. Keep the count at or below the runner's dirty
          CPU scheduler count (4 on ubuntu-latest) — local search runs on dirty
          schedulers, so extra seeds queue and then solve on an idle machine,
          which inflates their results and biases the mean.
        required: false
        default: "1,2,3,4"
      only:
        description: "Optional comma-separated instance ids to restrict the corpus (blank = all)."
        required: false
        default: ""
  pull_request:
    types: [labeled, synchronize]

jobs:
  swapstar-experiment:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'benchmark')
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      DEVENV_NO_GIT_HOOKS: "1"
      # pull_request events supply no inputs, so every knob needs a literal
      # fallback. Reading them through env also keeps ${{ }} out of the shell.
      BUDGET_CAP: ${{ inputs.budget_cap || '120' }}
      SEEDS: ${{ inputs.seeds || '1,2,3,4' }}
      ONLY: ${{ inputs.only || '' }}
      # cc_precompiler otherwise serves a released .so keyed on the package
      # VERSION rather than the git ref, which would silently run the shipped
      # solver instead of this branch's.
      EX_VRP_FORCE_BUILD: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Install devenv
        run: nix profile install --accept-flake-config github:cachix/devenv/latest

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Build once
        run: |
          devenv shell mix deps.get
          devenv shell mix compile

      - name: Record machine profile
        run: |
          echo "cores=$(nproc)" | tee /tmp/machine.txt
          cat /proc/cpuinfo | grep -m1 "model name" | tee -a /tmp/machine.txt

      # Arms run back to back on the same runner so they share a machine.
      # ONLY is passed through unquoted-if-empty via a conditional so that a
      # blank input means "whole corpus" rather than "--only ''".
      - name: Arm A - baseline (SwapStar absent)
        run: |
          ARGS="--out /tmp/A_baseline.json --ref A-baseline --seeds $SEEDS --budget-cap $BUDGET_CAP"
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          devenv shell mix bench.run $ARGS

      - name: Arm B - SwapStar, overlap tolerance 0.05
        env:
          EX_VRP_SWAP_STAR: "0.05"
        run: |
          ARGS="--out /tmp/B_tol005.json --ref B-swapstar-0.05 --seeds $SEEDS --budget-cap $BUDGET_CAP"
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          devenv shell mix bench.run $ARGS

      - name: Arm C - SwapStar, no pruning
        env:
          EX_VRP_SWAP_STAR: "1.0"
        run: |
          ARGS="--out /tmp/C_tol100.json --ref C-swapstar-1.0 --seeds $SEEDS --budget-cap $BUDGET_CAP"
          if [ -n "$ONLY" ]; then ARGS="$ARGS --only $ONLY"; fi
          devenv shell mix bench.run $ARGS

      - name: Verify the arms actually differed
        if: always()
        run: |
          A=$(jq -r '[.instances[].seeds[].iterations] | add' /tmp/A_baseline.json)
          B=$(jq -r '[.instances[].seeds[].iterations] | add' /tmp/B_tol005.json)
          echo "total iterations: A=$A B=$B"
          if [ "$A" = "$B" ]; then
            echo "::error::Arms A and B produced identical total iteration counts. \
          SwapStar was almost certainly not active in arm B — check that \
          EX_VRP_SWAP_STAR reaches the solver and that the NIF was built from this branch."
            exit 1
          fi

      # bench.compare exits 1 on regression. This is an experiment, not a gate:
      # a "regression" in arm B or C is a finding to read, not a job failure.
      - name: Pairwise comparisons
        if: always()
        run: |
          for pair in "A_baseline:B_tol005" "A_baseline:C_tol100" "B_tol005:C_tol100"; do
            base="${pair%%:*}"; cand="${pair##*:}"
            echo "===== $base -> $cand ====="
            devenv shell mix bench.compare "/tmp/$base.json" "/tmp/$cand.json" || true
          done | tee /tmp/compare.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo "## SwapStar three-arm experiment"
            echo
            echo "budget_cap=\`$BUDGET_CAP\`s seeds=\`$SEEDS\` only=\`$ONLY\`"
            echo "$(cat /tmp/machine.txt)"
            echo
            echo "Lower objective is better, so **negative Delta% = improvement**."
            echo "\`Noise\` is the seed-to-seed spread; a Delta% inside it is not a result."
            echo "\`Iter%\` is the change in iterations completed — that is the cost side."
            echo
            echo '```'
            cat /tmp/compare.txt 2>/dev/null || echo "(no comparison produced)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: swapstar-experiment-results
          path: |
            /tmp/A_baseline.json
            /tmp/B_tol005.json
            /tmp/C_tol100.json
            /tmp/compare.txt
            /tmp/machine.txt
