name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    # Every run step executes inside the devenv shell. devenv 2 runs all git hooks
    # (a full `mix check`, ~2.5 min) on each shell entry and ignores DEVENV_NO_GIT_HOOKS;
    # their failures don't fail the step, so they only cost time and print noise.
    defaults:
      run:
        shell: devenv -O git-hooks.enable:bool false shell bash -e {0}
    env:
      # Build the NIF from this ref's source. Without it, cc_precompiler may serve the
      # released binary (keyed on package version, not git ref), so tests + the quality
      # smoke would run against released code instead of the code under review.
      EX_VRP_FORCE_BUILD: "1"
      # Fail the build on any C++ compiler warning. CI only: consumers build with other
      # compilers, whose new warnings must not break their builds.
      EXTRA_CXXFLAGS: "-Werror"
      # One Mix environment for the whole job, so the deps and the NIF compile once.
      # Under the default dev, `mix test` compiled everything a second time for test.
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Magic Nix Cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Install devenv
        shell: bash
        run: |
          nix profile install --accept-flake-config github:cachix/devenv/latest

      - name: Cache Mix dependencies
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          # A hit on the primary key is never saved again, so the entry stays as the run that
          # made it left it; keying on the run as well saves each run's build (and its
          # dialyzer PLT) for the next. devenv.lock pins Elixir and OTP, whose builds Mix
          # recompiles every dependency for.
          key: ${{ runner.os }}-mix-test-${{ hashFiles('**/mix.lock', 'devenv.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-mix-test-${{ hashFiles('**/mix.lock', 'devenv.lock') }}-
            ${{ runner.os }}-mix-test-

      - name: Get dependencies
        run: |
          mix deps.get

      - name: Compile
        run: |
          mix compile --warnings-as-errors

      - name: Check formatting
        run: |
          mix format --check-formatted

      - name: Verify skill citations
        run: |
          mix run .claude/skills/verify_citations.exs

      - name: Check C++ formatting
        run: |
          task cpp:format:check

      - name: Run C++ static analysis
        run: |
          task cpp:check

      - name: Run tests
        run: |
          mix test

      - name: Run production benchmarks
        timeout-minutes: 10
        run: |
          mix test test/production_benchmark_test.exs --include production_benchmark_quick --only production_benchmark_quick

      - name: Run quality smoke
        timeout-minutes: 5
        run: |
          mix bench.smoke

      # ex_unit already ran in "Run tests"; mix check would run the suite again.
      - name: Run full checks
        if: github.event_name == 'pull_request'
        run: |
          mix check --except ex_unit

      - name: Reach change-safety analysis
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin main:refs/remotes/origin/main
          mix reach.check --changed --base origin/main

      # Last: it rebuilds the NIF with sanitizers and deletes it afterwards, so any Mix
      # step after it would compile the NIF once more.
      - name: Run AddressSanitizer tests
        run: |
          task test:asan
